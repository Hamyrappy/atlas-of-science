# Architecture 10 -- the materialised profile.
#
# What the ontology implies is computed ahead of the question by the OWL 2 RL rules and kept
# beside what was claimed, with the premises and the rule behind every consequence. The
# answer says which is which.
#
#   atlas run architectures/a10.yaml corpus/*.pdf --store store/
#   atlas ask architectures/a10.yaml "what is this a part of, at any remove?" --store store/

variant:
  id: a10
  number: 10
  title: Materialised entailment with derivation provenance
  summary: >-
    A restricted, executable profile: transitivity, symmetry and inverses computed ahead
    of the question, every consequence carrying the premises it came from, and an answer
    that never presents an inference as something a source reported.
  mechanism: >-
    `entail` closes the admitted relations under the OWL 2 RL rule table -- transitivity,
    inverses, symmetry, property chains, the sufficient conditions of defined classes --
    deduplicating a consequence that follows several ways
    while keeping every derivation of it. Derived links are never asserted, carry the
    spans of their premises rather than an invented one, and are marked in their fields.
    `supported` recomputes what still follows after a retraction from the ground up, so
    two derived relations that support each other in a circle do not stand on nothing.
  family: entailment traversal
  optimises: asking a question the ontology already answers, without a reasoner at query time
  cost: >-
    A closure whose size grows with the transitive relations declared, and a recompute
    after every retraction.
  needs: [model]
  scores: {relevance: 86, novelty: 79, prospect: 90, total: 86}
  questions:
    - What is this part of, at any remove?
    - Why is this relation in the answer, and what does it rest on?
    - Which conclusions fall if this claim is withdrawn, and which still follow?
  differs:
    a15: >-
      Expressiveness is traded for a closure that can actually be computed and kept: an
      axiom outside OWL 2 RL is refused by the profile the configuration names, rather
      than silently ignored by the rules.
    a05: >-
      What is computed is what the ontology implies, not what a dependency chain reaches:
      one is an axiom, the other is a fact about how a result was produced.
  reasoning: >-
    OWL 2 RL, the whole rule table, run over the data ahead of the question:
    transitivity, inverses, symmetry, property chains, the sufficient conditions of the
    defined classes, and disjointness as clashes. Every consequence keeps its derivation
    -- the rule's name in the W3C table, the premises, the axiom -- and `supported`
    recomputes from the ground up after a retraction. The DL tableau checks the ontology
    itself before a run writes under it.
  spec: docs/architectures/10-materialised-entailment.md

schema:
  ontologies: [science_core_rl, science_map_rl]
  profile: RL

steps:
  - {formal_check: {strict: true, engine: dl}}
  - ingest_pdf
  - {extract_llm: {segment: page}}
  - relocate
  - validate
  - {relate_llm: {segment: page}}
  - relate
  - {assert: {agent: run}}
  - index_nodes

ask:
  - index_nodes
  - retrieve
  - {entail: {rounds: 16}}
  - graph_expand_entailed:
      depth: 3
      limit: 80
      supports: [supports]
      opposes: [disputes]
  - graph_answer
