# Architecture 20 -- the answer as a plan of typed graph operations.
#
# A compound question is a composition, not a retrieval. Here it is written as a plan,
# checked against the pack before anything runs, executed step by step, and each step
# keeps the witnesses it stood on.
#
#   atlas ask architectures/a20.yaml "which results were obtained under which conditions?" \
#       --store store/

variant:
  id: a20
  number: 20
  title: Answering by a plan of typed graph operators
  summary: >-
    A small read-only operator language -- resolve, traverse, filter, join, aggregate,
    compare, oppose -- type-checked against the loaded pack before execution, executed
    with a trace, and packaged by the shared evidence closure.
  mechanism: >-
    The plan is checked once, as a whole: a relation the pack does not declare or a type
    it does not know stops it before anything runs, which is what makes accepting a
    generated plan safe rather than hopeful. An operator that reached nothing records the
    reason and the plan continues, so the trace names the step that emptied the answer
    rather than merely reporting that it is empty. An aggregate counts the whole selected
    set, because a question of the form "how many" is about a set and a ranked sample
    answers a different question.
  family: logical-form execution
  optimises: a compound question, where composing inside the prose is where it goes wrong
  cost: >-
    A plausible wrong plan. The type check catches a plan that names nothing real; it
    cannot catch a well-typed plan that asks the wrong question, which is why every step
    keeps its witnesses.
  needs: [model]
  scores: {relevance: 90, novelty: 93, prospect: 94, total: 92}
  questions:
    - Which results were obtained under which conditions, grouped?
    - Why was this study excluded from the comparison?
    - How many independent results are there, over the whole set?
  differs:
    a07: >-
      Not only which family of computation runs, but the sequence of typed operations
      inside the answer, each with its own witnesses.
    a06: >-
      The agents there improve how knowledge is built; the plan here improves how a
      question is answered over what was already built.
  spec: docs/architectures/20-operator-plan.md

schema: [science_core, scierc]

steps:
  - ingest_pdf
  - {extract_llm: {segment: page}}
  - relocate
  - validate
  - {relate_llm: {segment: page}}
  - relate
  - {assert: {agent: run}}
  - index_nodes

ask:
  - index_nodes
  - execute_plan:
      limit: 500
      plan:
        - {op: resolve, type: StudyResult}
        - {op: filter, field: value}
        - {op: aggregate}
        - {op: traverse, predicate: observed_under}
        - {op: compare, field: conditions}
      expand:
        depth: 3
        limit: 80
        supports: [supports]
        opposes: [disputes]
  - graph_answer
  - check_answer
