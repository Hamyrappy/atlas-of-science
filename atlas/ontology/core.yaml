# The frozen core of the markup. Six node types and eight relations, chosen to be
# the smallest set that still lets two domains be compared: everything a domain
# adds must descend from a type here.
#
# Editing this file changes the ontology version of every run made after it, and
# is a decision about the format, not about a corpus. Domain vocabulary belongs
# in an extension file, never here.

types:
  - name: Task
    description: A problem being addressed, stated independently of any solution.
    fields: [name, definition]

  - name: Method
    description: A procedure, model or technique applied to a task.
    fields: [name, summary]

  - name: Dataset
    description: A body of data a method was applied to or evaluated on.
    fields: [name, description]

  - name: Metric
    description: A quantity used to judge a result.
    fields: [name, unit]

  - name: Result
    description: A measured outcome, tied to the method, dataset and metric it was obtained with.
    fields: [statement, value, conditions]

  - name: Claim
    description: An assertion the authors make about the world, which a result may support or contradict.
    fields: [statement, scope]

predicates:
  - name: addresses
    domain: Method
    range: Task
    description: The method is proposed as a solution to the task.

  - name: evaluated_on
    domain: Method
    range: Dataset
    description: The method was run against this data.

  - name: measured_by
    domain: Result
    range: Metric
    description: The result is expressed in this metric.

  - name: obtained_by
    domain: Result
    range: Method
    description: The result was produced by this method.

  - name: reported_for
    domain: Result
    range: Dataset
    description: The result was obtained on this data.

  - name: supports
    domain: Result
    range: Claim
    description: The result is offered as evidence for the claim.

  - name: contradicts
    domain: Result
    range: Claim
    description: The result is evidence against the claim.

  - name: extends
    domain: Method
    range: Method
    description: The method is presented as a development of an earlier one.
