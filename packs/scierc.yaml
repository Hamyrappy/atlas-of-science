# A local, versioned profile of the SciERC annotation schema: six mention types and
# seven relations for scientific text.
#
# SciERC is an annotation scheme, not a published ontology. It has no official OWL IRIs,
# so this pack does not invent any: every term carries an `atlas:` IRI of our own and
# names the scheme it came from under `mappings`, with the source recorded here:
#
#   dct:source  https://nlp.cs.washington.edu/sciIE/
#
# That is the honest form of reuse. The labels, the distinctions and the relation set
# are taken from the scheme unchanged; the identities are ours and say so. A pack that
# minted `scierc:Method` would be claiming an identity nobody published, and every
# corpus that trusted it would be wrong in the same way.
#
# What the scheme does not carry is an argument: there is no position, no evidence and
# no computation here. That is the point of loading it alone -- it is the control
# architecture's vocabulary, and the difference it makes is what the five components of
# `science_core.yaml` are there to be measured against. Load both together to mark a
# corpus up with mentions and with the argument about them:
#
#   schema: [science_core, scierc]

prefixes:
  atlas: https://w3id.org/atlas-of-science/scierc#
  dct: http://purl.org/dc/terms/

types:
  - name: Task
    iri: atlas:Task
    mappings: ["dct:source https://nlp.cs.washington.edu/sciIE/"]
    description: A problem or objective being worked on, stated apart from any solution.
    fields: [name, definition]
    label_field: name

  - name: Method
    iri: atlas:Method
    mappings: ["dct:source https://nlp.cs.washington.edu/sciIE/"]
    description: A model, algorithm, procedure or technique named in the text.
    fields: [name, definition]
    label_field: name

  - name: Metric
    iri: atlas:Metric
    mappings: ["dct:source https://nlp.cs.washington.edu/sciIE/"]
    description: The name of a measure, kept apart from any value measured with it.
    fields: [name, unit, definition]
    label_field: name

  - name: Material
    iri: atlas:Material
    mappings: ["dct:source https://nlp.cs.washington.edu/sciIE/"]
    description: Data, a resource or a physical material, according to the context.
    fields: [name, definition]
    label_field: name

  - name: OtherScientificTerm
    iri: atlas:OtherScientificTerm
    mappings: ["dct:source https://nlp.cs.washington.edu/sciIE/"]
    description: A scientific term outside the other labels; a candidate, not a permanent class.
    fields: [name, definition]
    label_field: name

  - name: Generic
    iri: atlas:Generic
    mappings: ["dct:source https://nlp.cs.washington.edu/sciIE/"]
    description: A general or incomplete designation, resolved by coreference rather than typed.
    fields: [name, definition]
    label_field: name

predicates:
  - name: used_for
    iri: atlas:usedFor
    domain: Method
    range: Task
    description: Applied to this task in this context, which is not a purpose of every instance.

  - name: feature_of
    iri: atlas:featureOf
    domain: OtherScientificTerm
    range: Method
    description: A property of the thing, kept apart from any number recorded for it.

  - name: hyponym_of
    iri: atlas:hyponymOf
    domain: OtherScientificTerm
    range: OtherScientificTerm
    description: A candidate terminological inclusion, not a subclass axiom.

  # Named apart from `science_core`'s `part_of` on purpose. That one is the SIO part
  # relation between things in the world; this one is what the annotation scheme marks
  # between two mentions in a text, and merging them by their label is exactly the
  # bridge mistake the scheme warns about.
  - name: part_of_mention
    iri: atlas:partOfMention
    domain: Method
    range: Method
    description: A part in the stated sense; composition of a model and of a text are not one.

  - name: compare
    iri: atlas:compare
    domain: Method
    range: Method
    description: Compared with, which does not say that either one is better.

  - name: evaluate_for
    iri: atlas:evaluateFor
    domain: Method
    range: Metric
    description: Evaluated by this measure; the task, data and protocol are separate relations.

  - name: conjunction
    iri: atlas:conjunction
    domain: OtherScientificTerm
    range: OtherScientificTerm
    description: Coordinated in the text, which is not a causal or subject-matter relation.
