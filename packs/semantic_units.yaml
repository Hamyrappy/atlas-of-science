# What is being claimed, as opposed to who claims it: the form of the content itself.
#
# Load it beside `science_core.yaml`, whose `InformationEntity` and `Proposition` it
# builds on:
#
#   schema: [science_core, semantic_units]
#
# `science_core` models the argument -- a position, a line of evidence, a result. It says
# nothing about the *shape* of what is claimed, and three sentences that need very
# different treatment collapse into one proposition without this pack:
#
#   "some X have Y"      an existential claim; one case establishes it
#   "usually X have Y"   a statistical claim; counting is the only way to check it
#   "all X have Y"       a universal claim; one counterexample refutes it
#
# A store that recorded all three as "X relates to Y" has thrown away the thing that
# decides what a counterexample means, and no amount of retrieval gets it back.
#
# So a `SemanticUnit` records the kind of expression, the quantifier, the polarity, the
# modality and the scope, **and the original wording**. The last is not redundancy: what
# a formal translation loses is exactly what somebody later needs in order to find out
# that it lost it. The kinds, quantifiers and modalities are not enumerated here -- they
# are a run's configuration, checked by `compile_units` against what it was told to
# accept, because which distinctions matter is a property of the corpus.
#
# `logic_profile` is filled by `compile_units` and not by an extractor: whether a unit
# can be reasoned over is a judgement about completeness, not something to ask a model.

prefixes:
  atlas: https://w3id.org/atlas-of-science/units#

types:
  - name: SemanticUnit
    iri: atlas:SemanticUnit
    parent: InformationEntity
    description: The form of what is claimed - its kind, quantifier, polarity and scope.
    fields:
      - kind
      - quantifier
      - polarity
      - modality
      - scope
      - expression
      - logic_profile
      - definition
    label_field: expression

predicates:
  - name: expresses
    iri: atlas:expresses
    domain: Proposition
    range: SemanticUnit
    description: The claim has this form, which is what decides what would refute it.

  - name: counterexample_to
    iri: atlas:counterexampleTo
    domain: StudyResult
    range: SemanticUnit
    description: The result is offered against the unit - which only bites on some kinds.

  - name: holds_under
    iri: atlas:holdsUnder
    domain: SemanticUnit
    range: Context
    description: The conditions the claim is restricted to, where it is restricted at all.
