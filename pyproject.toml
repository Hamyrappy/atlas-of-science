[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-of-science"
version = "0.1.0"
description = "An open library for machine-readable scientific markup."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "pymupdf>=1.24",
    "rapidfuzz>=3.6",
    "httpx>=0.27",
    "rdflib>=7.0",
    "pyshacl>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
atlas = "atlas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

# The ontologies travel with the library: installing it gives you a vocabulary to start
# from, and `atlas.ontology.builtin` finds it in the wheel and in a checkout alike.
[tool.hatch.build.targets.wheel.force-include]
"ontologies" = "atlas/ontologies"
"architectures" = "atlas/architectures"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
