[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-of-science"
version = "0.1.0"
description = "An open library for machine-readable scientific markup."
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "pymupdf>=1.24",
    "rapidfuzz>=3.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
atlas = "atlas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The artifact types are a stable interface and keep their `str, Enum` spelling.
"atlas/contracts.py" = ["UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
